name: quality

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Known-answer test
        run: neural-sat-speck kat
      - name: Reproduce saved analyses and figures
        shell: bash
        run: |
          E=docs/paper/evidence
          python scripts/analyze_d063.py $E/d063_campaign_20261011/ledger_k00-31.jsonl > d063.json
          python scripts/analyze_d064.py $E/d064_campaign_20261011/ledger_k00-31.jsonl > d064.json
          python scripts/analyze_d065.py $E/d065_predictions/predictions.json d065.json $E/d065_campaign_20261012/ledger_k00-31.jsonl
          python -c "import json,sys; pairs=[('d063.json','$E/d063_campaign_20261011/summary.json'),('d064.json','$E/d064_campaign_20261011/summary.json'),('d065.json','$E/d065_campaign_20261012/summary.json')]; bad=[a for a,b in pairs if json.load(open(a))!=json.load(open(b))]; sys.exit(f'mismatch: {bad}' if bad else 0)"
          python scripts/generate_report_figures.py --profile report --force
          python scripts/generate_report_figures.py --profile lncs --force
