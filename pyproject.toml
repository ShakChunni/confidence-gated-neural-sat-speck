[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-sat-speck"
version = "0.1.0"
description = "Research artefact for confidence-gated neural guidance of exact SPECK32/64 recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neural-sat-speck = "neural_sat_speck.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]
sat = [
    "pycryptosat>=5.14,<6",
]
neural = [
    "torch>=2.0,<3",
    "numpy>=1.24,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
